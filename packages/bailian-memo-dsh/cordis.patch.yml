# bailian-memo-dsh: Bailian personal memory over dsh-base.
# Identity/consent live in ~/.bailian/personal-memory/config.json (cross-profile).
# API key resolves from dsh credentials (DASHSCOPE_API_KEY).

- insert:
    - id: tool-bailian-memo
      name: "bailian-memo-dsh"
      config:
        enabled: true
        autoRecall: true
        autoCurate: true
        recallTopK: 5
        minScore: 0
        curatorMaxOutputTokens: 512
        curatorTimeoutMs: 30000
