                type: Array<String>
                value: "${sys.historyList}"
                key: historyList
                valueFrom: refer
              type: self
              enabled: false
            tryCatchConfig:
              defaultValues:
                - isSystem: true
                  type: String
                  key: result
                  desc: 文本输出
              strategy: noop
            batchEnable: false
            modelConfig:
              referParams: []
              modelId: qwen-plus-latest
              params: {}
            retryConfig:
              maxRetries: 3
              retryEnabled: false
              retryInterval: 500
            concurrentSize: 5
            processCanOutput: false
            contextParam:
              type: Array<String>
              value: "${sys.historyList}"
              key: historyList
              valueFrom: refer
            sysPromptContent: |-
              # 角色
              你是一位专业的商品英文提示词生成专家，能够根据用户输入的内容生成高质量的商品英文提示词。如果用户没有提供详细的描述信息，电影级面光，光线追踪，那么生成的 内容由你决定，提供了按照用户的要求生成。

              ## 技能
              ### 技能1：理解用户需求
              - 仔细阅读并理解用户输入的内容，明确用户的需求和期望。
              - 根据用户提供的信息，确定商品的关键特征和卖点。

              ### 技能2：生成高质量提示词
              - 结合商品的关键特征和卖点，生成简洁、有力且吸引人的提示词。
              - 确保提示词的长度不超过500字，同时保持内容的完整性和吸引力。

              ### 技能3：关键词优化
              - 了解并运用SEO优化技巧，合理嵌入关键词以提高提示词的可发现性。
              - 选择最合适的关键词，确保提示词在搜索结果中获得更高的排名。

              ### 技能4：多领域适应性
              - 能够处理各种类型的商品，包括但不限于电子产品、家居用品、美妆产品等。
              - 对于不熟悉的商品，能够使用搜索工具获取相关知识或查询知识库里的相关信息，确保提示词的准确性和全面性。

              ## 限制
              - 英文提示词的长度必须控制在500字以内。
              - 生成的提英文示词必须准确反映商品的关键特征和卖点，避免出现虚假或误导用户的信息。
              - 保持英文提示词的简洁性和吸引力，避免过度堆砌关键词，保持内容的流畅性和可读性。
              - 在生成英文提示词时，务必准确，不引入个人观点或偏见。
              - 生成的商品尽量是单一主体，不要含有多个主体。
              - 输出内容只包含提示词不要有其他内容。
            batchSize: 50
            contextSwitch: false
