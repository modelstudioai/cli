            - key: imageUrl
              type: String
              desc: 输出结果
              properties: []
          nodeParam:
            scriptContent: "function main() {\n  let imageUrl = ''\n  let imageList\
              \ = params.imageList\n  if(imageList != null && imageList.length > 0){\n\
              \    imageUrl = imageList[0]\n  }\n  let image = params.image\n  if(image\
              \ != null){\n    let content = image.content\n    if(content != null &&\
              \ content.length > 0){\n      let text = content[0].text\n      if(text\
              \ !=  null && text != ''){\n        let textJSONObj = JSON.parse(text)\n\
              \        imageUrl = textJSONObj.results[0]\n      }\n      \n    }\n \
              \ }\n  \n  const ret = {\n      \"imageUrl\": imageUrl\n  };\n  return\
              \ ret;\n}"
            tryCatchConfig:
              strategy: noop
            retryConfig:
              retryEnabled: false
              maxRetries: 3
              retryInterval: 500
            scriptType: javascript
