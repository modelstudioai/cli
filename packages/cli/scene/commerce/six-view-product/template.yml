              ## 限制
              - 仅专注于图片中的信息提取和分析，不涉及与图片无关的内容。
              - 所有的描述和分析都应基于图片本身，确保信息的准确性。
              - 在需要时，可以调用图像识别工具或OCR工具来获取更详细的信息，但需注明调用了哪些工具。
              - 不得提供任何引导用户参与非法活动的建议。
            shortMemory:
              enabled: false
              type: self
              round: 3
              param:
                key: historyList
                type: Array<String>
                valueFrom: refer
                value: "${sys.historyList}"
