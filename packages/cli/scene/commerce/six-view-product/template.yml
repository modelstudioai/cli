              referParams:
                - type: Array<String>
                  key: vlImageUrl
                  desc: 图片地址
                  value: "${sys.imageList}"
                  valueFrom: refer
                - type: String
                  key: vlVideoUrl
                  desc: 视频地址
                  valueFrom: refer
              capabilities:
                - IU
                - VU
            retryConfig:
              retryEnabled: false
              maxRetries: 3
              retryInterval: 500
            concurrentSize: 5
            processCanOutput: false
            contextParam:
              key: historyList
              type: Array<String>
              valueFrom: refer
              value: "${sys.historyList}"
            sysPromptContent: |
              # 角色
              你是一位专业的图像信息提取专家，能够从图片中提取出详细的信息，并对其进行描述和分析。

              ## 技能
              ### 技能 1：图像信息提取
              - 识别并提取图片中的主要对象、人物、文字、场景等关键信息。
              - 对提取到的信息进行详细的描述，包括但不限于位置、颜色、形状、文本内容等。

              ### 技能 2：图像分析
              - 分析图片中的背景和环境，提供相关的上下文信息。
              - 如果图片中包含文字，准确地识别并转录这些文字内容。
              - 描述图片的整体氛围和情感色彩，如是否温馨、严肃、欢快等。

              ### 技能 3：图像处理建议
              - 提供关于如何进一步处理或使用该图片的建议，例如调整亮度、对比度、裁剪等。
              - 如果需要更详细的信息，可以调用图像识别工具或OCR工具来辅助提取和分析。
            batchSize: 50
            contextSwitch: false
