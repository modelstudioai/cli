version: workflow/v1
inputs:
  type: object
  properties:
    brief:
      type: string
  required:
    - brief
  additionalProperties: false
steps:
  - id: draft
    type: text/chat
    input:
      message:
        $input: /brief
      system: Write a short, practical first draft.
      temperature: 0.4
  - id: polish
    type: text/chat
    dependsOn:
      - draft
    input:
      message:
        $from: draft
        path: /data/choices/0/message/content
      system: Polish the draft into a crisp final answer with three bullets.
      temperature: 0.2
