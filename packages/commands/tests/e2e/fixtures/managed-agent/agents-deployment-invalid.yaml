version: "1"

providers:
  bailian:
    api_key: ${DASHSCOPE_API_KEY}
    base_url: ${BAILIAN_BASE_URL}

defaults:
  provider: bailian

environments:
  dev:
    config:
      type: cloud
      networking:
        type: unrestricted

agents:
  reporter:
    description: "Invalid deployment integration fixture"
    model: qwen3.7-max
    instructions: |
      Generate a concise engineering report from the mounted template.
    environment: dev

deployments:
  invalid-report:
    agent: reporter
    initial_events:
      - type: user.define_outcome
        rubric: "Report is concise and actionable."
    resources:
      - type: file
        source: ./report-template.md
      - type: file
        source: ./report-template.md
        mount_path: report-template.md
      - type: file
        source: ./report-template.md
        mount_path: /mnt/report-template.md
