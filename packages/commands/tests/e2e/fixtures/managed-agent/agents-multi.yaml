version: "1"

providers:
  bailian:
    api_key: ${DASHSCOPE_API_KEY}
    base_url: ${BAILIAN_BASE_URL}
  claude:
    api_key: ${ANTHROPIC_API_KEY}

defaults:
  provider: all

environments:
  dev:
    config:
      type: cloud
      networking:
        type: unrestricted

agents:
  assistant:
    description: "E2E multi-provider fixture"
    model:
      bailian: qwen3.7-max
      claude: claude-sonnet-4-6
    instructions: |
      You are a helpful assistant.
    environment: dev
