packages:
  - packages/*
  - tools/*

catalog:
  "@types/node": ^24
  "@types/yauzl": ^3.4.0
  ajv: ^8.20.0
  boxen: ^8.0.1
  chalk: ^5.6.2
  typescript: ^5
  undici: ^8.4.1
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  yaml: ^2.8.3
  yauzl: ^3.4.0

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
